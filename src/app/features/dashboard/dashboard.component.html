<div class="min-h-screen bg-slate-50">
  <nav class="bg-white shadow-sm border-b border-slate-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between h-16">
        <div class="flex items-center">
          <span class="text-2xl font-bold text-primary-600">Gym Manager</span>
        </div>
        <div class="flex items-center space-x-4">
          <span class="text-sm text-slate-600">Welcome, {{ authService.currentUser()?.name }}</span>
          <button (click)="logout()" 
            class="px-4 py-2 text-sm font-medium text-white bg-red-500 rounded-lg hover:bg-red-600 transition-colors">
            Logout
          </button>
        </div>
      </div>
    </div>
  </nav>
  
  <main class="max-w-7xl mx-auto py-10 px-4 sm:px-6 lg:px-8">
    <h1 class="text-3xl font-bold text-slate-900">Dashboard</h1>
    <div class="mt-8 grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3">
      <!-- Placeholder Stats -->
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
        <h3 class="text-slate-500 text-sm font-medium">Role</h3>
        <p class="mt-2 text-2xl font-bold text-slate-900 capitalize">{{ authService.userRole() }}</p>
      </div>
    </div>
    
    <div class="mt-12 bg-white p-8 rounded-2xl shadow-sm border border-slate-100 text-center">
      <p class="text-slate-600">Foundation and Authentication Phase complete.</p>
      <p class="mt-2 text-sm text-slate-400">Next step: Core Layouts & Shared UI</p>
    </div>
  </main>
</div>
