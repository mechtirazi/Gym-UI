<div class="hero-profile-card">
  <div class="hero-bg-wrapper">
    <div class="hero-overlay"></div>
    <div class="hero-image" style="background-image: url('/images/gym-bg.png')"></div>

    @if (isEditing()) {
    <button class="hero-change-btn blur-bg">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z" />
        <circle cx="12" cy="13" r="4" />
      </svg>
      Update Cover Photo
    </button>
    }
  </div>

  <div class="hero-info-section">
    <div class="avatar-box">
      <div class="avatar-shield">
        <span class="avatar-initials">{{ name() ? name().charAt(0) : 'G' }}</span>
        <div class="verify-badge">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"
              fill="white" />
          </svg>
        </div>
      </div>
      @if (isEditing()) {
      <button class="avatar-edit-tag">Change Logo</button>
      }
    </div>

    <div class="hero-text">
      <h1 class="gym-brand">{{ name() || 'Unnamed Establishment' }}</h1>
      <div class="meta-tags">
        <span class="status-badge"><span class="dot"></span> Managed by GymUI</span>
        <span class="location-tag" [title]="address()">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z" />
            <circle cx="12" cy="10" r="3" />
          </svg>
          {{ (address() | slice:0:35) || 'Location not set' }}...
        </span>
      </div>
    </div>

    <div class="hero-actions">
      @if (!isEditing()) {
      <button class="primary-action-btn glass-effect" (click)="onToggleEdit.emit()">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" />
          <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" />
        </svg>
        Modify Profile
      </button>
      } @else {
      <div class="edit-btn-group">
        <button class="secondary-action-btn cancel-btn blur-bg" (click)="onToggleEdit.emit()" [disabled]="isSaving()">
          Discard Changes
        </button>
        <button class="primary-action-btn save-btn glass-effect accent-glow" (click)="onSave.emit()"
          [disabled]="!canSave()">
          @if (isSaving()) {
          <span class="mini-spinner"></span> Fixing Data...
          } @else {
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12" />
          </svg>
          Confirm Changes
          }
        </button>
      </div>
      }
    </div>
  </div>
</div>
