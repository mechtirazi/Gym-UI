<form class="main-dashboard-grid" [formGroup]="formGroup()">
  
  <!-- Primary Profile Identity -->
  <div class="dashboard-card main-identity shadow-soft blur-card">
    <div class="card-header-v2">
      <div class="icon-title">
        <div class="title-bg blue-soft">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
        </div>
        <h3>Core Identification</h3>
      </div>
    </div>

    <div class="input-grid-section">
      <div class="premium-field">
        <label>Legal Business Name</label>
        <div class="field-input-box" [class.readonly-box]="!isEditing()">
          <input type="text" formControlName="name" placeholder="Enter gym name">
        </div>
      </div>

      <div class="premium-field full-row">
        <label>Executive Description / Motto</label>
        <div class="field-input-box textarea-box" [class.readonly-box]="!isEditing()">
          <textarea formControlName="description" rows="5" placeholder="Tell your story. What makes this gym special?"></textarea>
        </div>
      </div>
    </div>
  </div>

  <!-- Public Reach & Access -->
  <div class="dashboard-card shadow-soft blur-card">
    <div class="card-header-v2">
      <div class="icon-title">
        <div class="title-bg purple-soft">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        </div>
        <h3>Contact & Accessibility</h3>
      </div>
    </div>

    <div class="input-grid-section">
      <div class="premium-field">
        <label>Primary Business Email</label>
        <div class="field-input-box" [class.readonly-box]="!isEditing()">
          <input type="email" formControlName="email">
        </div>
      </div>

      <div class="premium-field">
        <label>Direct Support Line</label>
        <div class="field-input-box" [class.readonly-box]="!isEditing()">
          <input type="tel" formControlName="phone">
        </div>
      </div>

      <div class="premium-field full-row">
        <label>Operational Street Address</label>
        <div class="field-input-box" [class.readonly-box]="!isEditing()">
          <input type="text" formControlName="address">
        </div>
      </div>

      <!-- Future Fields -->
      <div class="field-divider"><span>Advanced Details</span></div>
      
      <div class="gym-perks-info">
        <p><strong>Note:</strong> Operating hours and membership tiers are managed in separate sections for security.</p>
      </div>
    </div>
  </div>

</form>
